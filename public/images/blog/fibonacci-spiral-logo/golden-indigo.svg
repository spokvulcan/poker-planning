<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#fff" fill-opacity=".09"/></pattern></defs><rect width="1200" height="675" fill="#170E3C"/><rect width="1200" height="675" fill="url(#dots)"/><text x="60" y="78" font-size="34" font-weight="700" fill="#fff" text-anchor="start">Even the colour is made of φ</text><text x="60" y="114" font-size="19" font-weight="400" fill="#DCD4FF" text-anchor="start">Red, green and blue are powers of the golden ratio. Divide each by φ and you get the deep shade.</text><rect x="60" y="168" width="132" height="132" rx="29" fill="#613CFF"/><text x="218" y="212" font-size="28" font-weight="700" fill="#fff" text-anchor="start">Golden indigo</text><text x="218" y="246" font-size="20" font-weight="400" fill="#DCD4FF" text-anchor="start">#613CFF</text><text x="218" y="280" font-size="19" font-weight="400" fill="#B8A7FF" text-anchor="start">RGB = (1/φ², 1/φ³, 1)</text><text x="60" y="368" font-size="20" font-weight="700" fill="#FF7A7A" text-anchor="start">R</text><rect x="96" y="352" width="300" height="20" rx="10" fill="#fff" fill-opacity=".1"/><rect x="96" y="352" width="114.59" height="20" rx="10" fill="#FF7A7A"/><text x="416" y="368" font-size="19" font-weight="400" fill="#fff" text-anchor="start">1/φ² = 0.382</text><text x="60" y="438" font-size="20" font-weight="700" fill="#5EE59A" text-anchor="start">G</text><rect x="96" y="422" width="300" height="20" rx="10" fill="#fff" fill-opacity=".1"/><rect x="96" y="422" width="70.82" height="20" rx="10" fill="#5EE59A"/><text x="416" y="438" font-size="19" font-weight="400" fill="#fff" text-anchor="start">1/φ³ = 0.236</text><text x="60" y="508" font-size="20" font-weight="700" fill="#6FA8FF" text-anchor="start">B</text><rect x="96" y="492" width="300" height="20" rx="10" fill="#fff" fill-opacity=".1"/><rect x="96" y="492" width="300" height="20" rx="10" fill="#6FA8FF"/><text x="416" y="508" font-size="19" font-weight="400" fill="#fff" text-anchor="start">1 = 1.000</text><rect x="650" y="168" width="132" height="132" rx="29" fill="#3C259E"/><text x="808" y="212" font-size="28" font-weight="700" fill="#fff" text-anchor="start">Deep golden indigo</text><text x="808" y="246" font-size="20" font-weight="400" fill="#DCD4FF" text-anchor="start">#3C259E</text><text x="808" y="280" font-size="19" font-weight="400" fill="#B8A7FF" text-anchor="start">RGB = (1/φ³, 1/φ⁴, 1/φ)</text><text x="650" y="368" font-size="20" font-weight="700" fill="#FF7A7A" text-anchor="start">R</text><rect x="686" y="352" width="300" height="20" rx="10" fill="#fff" fill-opacity=".1"/><rect x="686" y="352" width="70.82" height="20" rx="10" fill="#FF7A7A"/><text x="1006" y="368" font-size="19" font-weight="400" fill="#fff" text-anchor="start">1/φ³ = 0.236</text><text x="650" y="438" font-size="20" font-weight="700" fill="#5EE59A" text-anchor="start">G</text><rect x="686" y="422" width="300" height="20" rx="10" fill="#fff" fill-opacity=".1"/><rect x="686" y="422" width="43.77" height="20" rx="10" fill="#5EE59A"/><text x="1006" y="438" font-size="19" font-weight="400" fill="#fff" text-anchor="start">1/φ⁴ = 0.146</text><text x="650" y="508" font-size="20" font-weight="700" fill="#6FA8FF" text-anchor="start">B</text><rect x="686" y="492" width="300" height="20" rx="10" fill="#fff" fill-opacity=".1"/><rect x="686" y="492" width="185.41" height="20" rx="10" fill="#6FA8FF"/><text x="1006" y="508" font-size="19" font-weight="400" fill="#fff" text-anchor="start">1/φ = 0.618</text><path d="M560 234H616" stroke="#B8A7FF" stroke-width="3"/><path d="M614 224L630 234L614 244Z" fill="#B8A7FF"/><text x="595" y="214" font-size="22" font-weight="700" fill="#B8A7FF" text-anchor="middle">÷ φ</text><text x="600" y="615" font-size="17" font-weight="400" fill="#DCD4FF" text-anchor="middle">Both share one hue, 240° + 30°/φ² ≈ 251.5°: blue turned by a twelfth of the golden angle.</text></svg>
