<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#fff" fill-opacity=".09"/></pattern></defs><rect width="1200" height="675" fill="#170E3C"/><rect width="1200" height="675" fill="url(#dots)"/><text x="60" y="78" font-size="34" font-weight="700" fill="#fff" text-anchor="start">One quarter-circle in every square</text><text x="60" y="114" font-size="19" font-weight="400" fill="#DCD4FF" text-anchor="start">Each arc's radius is its square's side. Where one arc ends, the next begins, heading the same way.</text><rect x="275" y="166" width="400" height="400" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"/><rect x="675" y="166" width="250" height="250" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"/><rect x="775" y="416" width="150" height="150" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"/><rect x="675" y="466" width="100" height="100" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"/><rect x="675" y="416" width="50" height="50" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"/><rect x="725" y="416" width="50" height="50" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"/><text x="475" y="395.4" font-size="84" font-weight="700" fill="#B8A7FF" text-anchor="middle" fill-opacity="0.55">8</text><text x="800" y="312" font-size="60" font-weight="700" fill="#B8A7FF" text-anchor="middle" fill-opacity="0.55">5</text><text x="850" y="505.7" font-size="42" font-weight="700" fill="#B8A7FF" text-anchor="middle" fill-opacity="0.55">3</text><text x="725" y="525.8" font-size="28" font-weight="700" fill="#B8A7FF" text-anchor="middle" fill-opacity="0.55">2</text><path d="M275 566A400 400 0 0 1 675 166A250 250 0 0 1 925 416A150 150 0 0 1 775 566A100 100 0 0 1 675 466A50 50 0 0 1 725 416A50 50 0 0 1 775 466" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="675" cy="566" r="4.5" fill="#B8A7FF"/><circle cx="675" cy="416" r="4.5" fill="#B8A7FF"/><circle cx="775" cy="416" r="4.5" fill="#B8A7FF"/><circle cx="775" cy="466" r="4.5" fill="#B8A7FF"/><circle cx="725" cy="466" r="4.5" fill="#B8A7FF"/><circle cx="675" cy="166" r="6" fill="#170E3C" stroke="#fff" stroke-width="2.5"/><circle cx="925" cy="416" r="6" fill="#170E3C" stroke="#fff" stroke-width="2.5"/><circle cx="775" cy="566" r="6" fill="#170E3C" stroke="#fff" stroke-width="2.5"/><circle cx="675" cy="466" r="6" fill="#170E3C" stroke="#fff" stroke-width="2.5"/><text x="600" y="640" font-size="17" font-weight="400" fill="#DCD4FF" text-anchor="middle">Dots: the centre of each arc. Rings: where one arc hands over to the next.</text></svg>
