/* ==========================================================================
   Guided walkthroughs
   ========================================================================== */
function ff(kind) {
  // fast-forward the shared pointer to a stage, doing the obvious setup
  const acts = [];
  const target = state.stageList.find((e) => e.kind === kind);
  if (!target) return acts;
  if (["vote", "discuss", "close"].includes(kind)) acts.push({ type: "fileRemaining" });
  acts.push({ type: "movePointerTo", entryId: state.stageList.find((e) => e.kind === "review").id, by: "p1" });
  if (["vote", "discuss", "close"].includes(kind)) acts.push({ type: "simulateTeamVotes" });
  acts.push({ type: "movePointerTo", entryId: target.id, by: "p1" });
  return acts;
}

const SAMPLE_CARDS = [
  "Nobody owns the Convex migration runbook and it shows",
  "The retro board should probably not need eight tabs open",
  "We keep discovering the same lockfile problem every third sprint",
  "Two people fixed the same flake in different ways this week",
];
let sampleAt = 0;

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const d = t.dataset;
  const stage = (kind) => (state.stageList.find((e) => e.kind === kind) || {}).id;

  switch (d.act) {
    case "advance": dispatch({ type: "advance", by: "p1" }); break;
    case "rewind": dispatch({ type: "rewind", by: "p1" }); break;
    case "movePointer": ev.stopPropagation(); dispatch({ type: "movePointerTo", entryId: d.entry, by: state.actorId }); break;
    case "lookAt": dispatch({ type: "lookAt", entryId: d.entry }); break;
    case "followShared": dispatch({ type: "followShared" }); break;
    case "dismissNotice": dispatch({ type: "dismissMoveNotice" }); break;

    case "setPrompt": ui.draftPrompt = d.prompt; render(); break;
    case "setDockPrompt": ui.dockPrompt = d.prompt; render(); break;
    case "postCard": postCard(); break;
    case "postDockCard": postDockCard(); break;
    case "deleteCard": dispatch({ type: "deleteCard", cardId: d.card }); break;
    case "toggleDock": ui.dockOpen = !ui.dockOpen; ui.visOpen = false; render(); break;
    case "visMenu": ui.visOpen = !ui.visOpen; ui.dockOpen = false; render(); break;
    case "toggleVis": dispatch({ type: "setVisibility", key: d.key, value: !state.visibility[d.key] }); break;

    case "carry": dispatch({ type: "toggleCarryAction", id: d.id, status: d.status }); break;

    case "file": dispatch({ type: "fileCard", cardId: d.card, groupId: d.group }); break;
    case "fileNew": { const title = ui.newGroupTitle; ui.newGroupTitle = ""; dispatch({ type: "fileCardToNew", cardId: d.card, title }); break; }
    case "loose": dispatch({ type: "leaveLoose", cardId: d.card }); break;
    case "toggleThemes": ui.showAllThemes = !ui.showAllThemes; render(); break;
    case "fileRemaining": dispatch({ type: "fileRemaining" }); break;
    case "playUnfile": { const c = state.cards.find((x) => x.groupId !== null); if (c) dispatch({ type: "unfile", cardId: c.id }); break; }

    case "budget": dispatch({ type: "setBudget", n: Number(d.n) }); break;
    case "budgetSuggested": dispatch({ type: "setBudget", n: M.suggestedBudget(state) }); break;
    case "cast": dispatch({ type: "castVote", topicId: d.topic }); break;
    case "retract": dispatch({ type: "retractVote", topicId: d.topic }); break;
    case "simVotes": dispatch({ type: "simulateTeamVotes" }); break;

    case "walkNext": dispatch({ type: "walkNext" }); break;
    case "walkPrev": dispatch({ type: "walkPrev" }); break;
    case "skipTopic": dispatch({ type: "walkNext", markCovered: false }); break;
    case "walkGoto": dispatch({ type: "walkGoto", topicId: d.topic }); break;
    case "markCovered": dispatch({ type: "markCovered", covered: d.covered === "1" }); break;
    case "resnapshot": dispatch({ type: "resnapshotWalk" }); break;
    case "gotoDiscuss": dispatchMany([{ type: "lookAt", entryId: stage("discuss") }, { type: "walkGoto", topicId: d.topic }]); break;

    case "addAction": {
      const text = ui.actText, owner = ui.actOwner, trig = ui.actTrigger;
      ui.actText = ""; ui.actTrigger = "";
      dispatch({ type: "addAction", text, ownerId: owner, trigger: trig,
                 topicId: state.walk ? state.walk.currentId : null });
      break;
    }

    case "ready": dispatch({ type: "setReady", on: d.on === "1" }); break;
    case "playAllReady": dispatchMany(state.people.filter((p) => p.present).map((p) => ({ type: "setReady", personId: p.id, on: true }))); break;

    case "skipStage": dispatch({ type: "skipStage", entryId: d.entry }); break;
    case "restoreStage": dispatch({ type: "restoreStage", kind: d.kind }); break;
    case "toggleTimebox": dispatch({ type: state.timeboxRunning ? "pauseTimebox" : "startTimebox" }); break;
    case "tick": dispatchMany([{ type: "startTimebox" }, { type: "tick", ms: Number(d.ms) }]); break;

    case "playWrite": dispatch({ type: "writeCard", text: SAMPLE_CARDS[sampleAt++ % SAMPLE_CARDS.length], prompt: "slowed" }); break;
    case "playWriteOther": dispatch({ type: "writeCard", authorId: "p2", text: "One more: the docs build broke and nobody noticed for a day", prompt: "slowed" }); break;
    case "playTypeOther": dispatch({ type: "setTyping", personId: "p5", on: true }); break;
    case "playStopOther": dispatch({ type: "setTyping", personId: "p5", on: false }); break;
    case "playTypeMe": dispatch({ type: "setTyping", personId: state.actorId, on: true }); break;
    case "playDanJoins": dispatch({ type: "arriveLate", personId: "p8" }); break;
    case "playTobyWanders": dispatch({ type: "personLooksAt", personId: "p2", entryId: stage("collect") }); break;

    case "wtPick": ui.wt = d.wt; render(); break;
    case "wtRestart": ui.wtIdx[ui.wt] = 0; render(); break;
    case "wtStep": {
      const w = WALKTHROUGHS.find((x) => x.id === ui.wt);
      const i = Number(d.i);
      w.steps[i].run();
      ui.wtIdx[w.id] = Math.min(i + 1, w.steps.length);
      render();
      break;
    }
    case "reset": state = M.createInitialState(); ui.draft = ""; ui.wtIdx = {}; render(); break;
    default: break;
  }
});

function postCard() {
  const text = ui.draft.trim();
  if (!text) return;
  ui.draft = "";
  dispatchMany([{ type: "setTyping", personId: state.actorId, on: false },
                { type: "writeCard", text, prompt: ui.draftPrompt }]);
}
function postDockCard() {
  const text = ui.dockDraft.trim();
  if (!text) return;
  ui.dockDraft = "";
  dispatch({ type: "writeCard", text, prompt: ui.dockPrompt });
}

document.addEventListener("input", (ev) => {
  const b = ev.target.dataset && ev.target.dataset.bind;
  if (!b) return;
  if (b === "lookElsewhere") return;
  ui[b] = ev.target.value;
  if ((b === "draft" || b === "dockDraft") && ui[b].length > 0) {
    const me = M.person(state, state.actorId);
    if (me && !me.typing) dispatch({ type: "setTyping", personId: state.actorId, on: true });
    clearTimeout(ui.typingTimer);
    ui.typingTimer = setTimeout(() => {
      const m = M.person(state, state.actorId);
      if (m && m.typing) dispatch({ type: "setTyping", personId: state.actorId, on: false });
    }, 4000);
  }
});

document.addEventListener("change", (ev) => {
  const b = ev.target.dataset && ev.target.dataset.bind;
  if (b === "lookElsewhere" && ev.target.value) { dispatch({ type: "lookAt", entryId: ev.target.value }); return; }
  if (b) { ui[b] = ev.target.value; }
  if (ev.target.id === "actor") dispatch({ type: "setActor", personId: ev.target.value });
});

document.addEventListener("keydown", (ev) => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if (inField && (ev.metaKey || ev.ctrlKey) && ev.key === "Enter") {
    if (ev.target.dataset.fk === "composer") { ev.preventDefault(); postCard(); }
    if (ev.target.dataset.fk === "dockdraft") { ev.preventDefault(); postDockCard(); }
    if (ev.target.dataset.fk === "acttext" || ev.target.dataset.fk === "acttrig") {
      ev.preventDefault();
      const text = ui.actText, owner = ui.actOwner, trig = ui.actTrigger;
      ui.actText = ""; ui.actTrigger = "";
      dispatch({ type: "addAction", text, ownerId: owner, trigger: trig, topicId: state.walk ? state.walk.currentId : null });
    }
    return;
  }
  if (inField) return;

  // grouping deck shortcuts
  if (M.myKind(state) === "group") {
    const card = M.deckCardFor(state, state.actorId);
    if (!card) return;
    const themes = state.groups.map((g) => ({ g, n: state.cards.filter((c) => c.groupId === g.id).length }))
      .filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
    if (/^[1-9]$/.test(ev.key)) {
      const pick = themes[Number(ev.key) - 1];
      if (pick) { ev.preventDefault(); dispatch({ type: "fileCard", cardId: card.id, groupId: pick.g.id }); }
      return;
    }
    if (ev.key === "n") { ev.preventDefault(); const t = ui.newGroupTitle; ui.newGroupTitle = ""; dispatch({ type: "fileCardToNew", cardId: card.id, title: t }); return; }
    if (ev.key === "s") { ev.preventDefault(); dispatch({ type: "leaveLoose", cardId: card.id }); return; }
  }
  // walk shortcuts
  if (M.myKind(state) === "discuss" && state.walk) {
    if (ev.key === "ArrowRight" || ev.key === "j") { ev.preventDefault(); dispatch({ type: "walkNext" }); }
    if (ev.key === "ArrowLeft" || ev.key === "k") { ev.preventDefault(); dispatch({ type: "walkPrev" }); }
  }
});

el("instTab").addEventListener("click", () => { ui.instOpen = true; render(); });
el("instClose").addEventListener("click", () => { ui.instOpen = false; render(); });
el("scrim").addEventListener("click", () => { ui.instOpen = false; render(); });
el("theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "auto" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  el("theme").textContent = next === "auto" ? "Theme" : next === "dark" ? "Dark" : "Light";
});

/* a slow, quiet clock so the advisory timebox is real */
setInterval(() => {
  if (!state.timeboxRunning) return;
  state = M.reduce(state, { type: "tick", ms: 1000 });
  const a = document.activeElement;
  if (a && a.dataset && a.dataset.fk) renderRail(); else render();
}, 1000);

render();
})();
</script>
</body>
