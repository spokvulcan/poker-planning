name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time; a new push cancels the review of the previous one.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # The action refuses bot actors (Dependabot, release-please, Claude's own pushes),
    # and GitHub gives fork PRs no secrets, so skip those instead of failing.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Anthropic's code-review plugin: parallel agents check bugs and CLAUDE.md compliance,
          # and each finding is validated before it is posted. It skips draft, closed, trivial
          # and automated PRs, and PRs Claude has already commented on.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"

          # --comment posts an inline comment on each issue, or one summary comment when there are none.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          # The action starts the inline comment server only when --allowedTools names it.
          # See https://code.claude.com/docs/en/github-actions#run-a-skill
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
